# Tomcat
server:
    tomcat:
        uri-encoding: UTF-8
    port: 8080
    servlet:
        context-path: /cl10989512


spring:
    datasource:
      driverClassName: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://127.0.0.1:3306/fang?useUnicode=true&characterEncoding=utf-8&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8&useSSL=false
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:change-me}

#        driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
#        url: jdbc:sqlserver://127.0.0.1:1433;DatabaseName=cl10989512

    servlet:
      multipart:
        max-file-size: 100MB
        max-request-size: 100MB
    resources:
      static-locations: classpath:static/,file:static/

#mybatis
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: com.cl.entity
  global-config:
    #主键类型  0:"数据库ID自增", 1:"用户输入ID",2:"全局唯一ID (数字类型唯一ID)", 3:"全局唯一ID UUID";
    id-type: 1
    #字段策略 0:"忽略判断",1:"非 NULL 判断"),2:"非空判断"
    field-strategy: 1
    #驼峰下划线转换
    db-column-underline: true
    #刷新mapper 调试神器
    refresh-mapper: true
    #逻辑删除配置
    logic-delete-value: -1
    logic-not-delete-value: 0
    #自定义SQL注入器
    sql-injector: com.baomidou.mybatisplus.mapper.LogicSqlInjector
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    #springboot 项目mybatis plus 设置 jdbcTypeForNull (oracle数据库需配置JdbcType.NULL, 默认是Other)
    jdbc-type-for-null: 'null' 
# AI assistant (disabled until a server-side provider key and endpoint are configured)
ai:
  enabled: ${AI_ENABLED:false}
  search-enabled: ${AI_SEARCH_ENABLED:true}
  provider: ${AI_PROVIDER:zhipu}
  base-url: ${AI_BASE_URL:https://open.bigmodel.cn/api/paas/v4/chat/completions}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:glm-4-flash}
  timeout-ms: ${AI_TIMEOUT_MS:60000}
  max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:800}
  temperature: ${AI_TEMPERATURE:0.3}
  max-requests-per-minute: ${AI_MAX_REQUESTS_PER_MINUTE:10}
  max-history-messages: ${AI_MAX_HISTORY_MESSAGES:12}
  max-input-characters: ${AI_MAX_INPUT_CHARACTERS:12000}

booking:
  reminders:
    enabled: ${BOOKING_REMINDERS_ENABLED:true}




